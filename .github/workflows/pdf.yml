name: Build the typeset book

on:
  push:
    branches: [main]
    tags: ['v*-alpha.*']
    paths: ['*.md', 'scripts/**', '.github/workflows/pdf.yml']
  pull_request:
    paths: ['*.md', 'scripts/**', '.github/workflows/pdf.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the book source
        run: python3 scripts/build_content.py
      - name: Install the TeX toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra texlive-fonts-recommended
      - name: Build PDF and fail on TeX errors
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build calculus_workbook.tex
      - uses: actions/upload-artifact@v4
        with:
          name: calculus-workbook-pdf
          path: build/calculus_workbook.pdf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calculus-workbook-pdf
          path: book
      - name: Publish the alpha book as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BOOK_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          Complete current manuscript in a single compiled PDF. **Alpha development:** the material may contain errors, and mathematical correctness is not guaranteed.

          Includes the notation standard, worked differentiation and integration chapters, supporting tricks appendix, and notation literature review. Every included practice problem has hints, a complete solution, and a check. Supporting tricks are purple; algebra in the main chapters is dark blue.

          Educational content: CC BY-SA 4.0. Software: MIT. See the repository's licenses and accuracy notice.
          EOF
          if gh release view "$BOOK_TAG" > /dev/null 2>&1; then
            gh release upload "$BOOK_TAG" book/calculus_workbook.pdf --clobber
          else
            gh release create "$BOOK_TAG" book/calculus_workbook.pdf --verify-tag --prerelease --title "Calculus Workbook $BOOK_TAG — Alpha" --notes-file notes.md
          fi
